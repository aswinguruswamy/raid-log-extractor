name: live-eval

# Live eval on the 10 tuning calls (RAID v2 spec R16.1, decision RD2).
# Runs when a pull request changes the prompt, the code checks, the model setting or the
# Claude SDK, and on demand. It fails on any invented owner or invented date (R16.1).
# Cost: about US$0.10 per run. The key is the repository secret.
on:
  pull_request:
    paths:
      - "raid/extract.py"
      - "raid/evaluate.py"
      - "raid/checks.py"
      - "raid/dates.py"
      - "requirements.txt"
      - "evals/answers/**"
      - "evals/spec_cases/**"
      - "evals/run_eval.py"
      - ".github/workflows/live-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tuning-eval:
    # Dependabot and fork pull requests get no secrets; they skip this job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run the eval on the 10 tuning calls and the spec examples
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "import anthropic; print('anthropic', anthropic.__version__)"
          python evals/run_eval.py --gate || status=$?
          python evals/run_eval.py --set spec --gate || status=$?
          cat evals/report.md evals/spec_cases/report.md >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tuning-eval
          path: |
            evals/report.md
            evals/outputs/
            evals/spec_cases/report.md
            evals/spec_cases/outputs/
