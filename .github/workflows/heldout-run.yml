name: heldout-run

# Held-out run (RAID v2 task A10; spec R13-R15, N1): 28 calls x 5 runs with the
# repository secret. Started by hand only. Cost: about US$2 per run.
# The outputs and the report are uploaded as an artifact; they are committed in their own
# pull request, after the key commits (AC39), and the release gate is then run on them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heldout-run
  cancel-in-progress: false

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the key-order check reads the full history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run the 28 held-out calls 5 times
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python evals/run_eval.py --set heldout --runs 5
          cat evals/heldout/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heldout-run
          path: |
            evals/heldout/report.md
            evals/heldout/outputs/
