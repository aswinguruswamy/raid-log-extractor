name: Release

# Release workflow (shared item SH6, RAID v2 spec R18.1). A version tag such as v2.0.0
# runs it: the version check, lint and tests, then a GitHub release with the notes from
# CHANGELOG.md. RAID is not a package (an installable package is a later item), so the
# release has the source archives that GitHub adds. A person pushes the tag after "Go".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to make the GitHub release

jobs:
  release:
    name: Check and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag and the version agree
        run: |
          version=$(python -c "import raid; print(raid.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in raid/__init__.py."
            exit 1
          fi
      - run: python -m pip install -r requirements.txt
      - name: Lint and tests
        run: |
          ruff check .
          python -m pytest -q
      - name: Get the release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
