# Lint rules (shared CI standard SH1). Python 3.11 is the oldest supported version.
# E501 (line length) is off: the prompt text in raid/extract.py must not be rewrapped,
# because that would change the prompt. UP042 and B905 are off: their fixes change behaviour.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP042", "B905"]
